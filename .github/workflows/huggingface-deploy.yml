name: 🚀 Deploy to Hugging Face Spaces

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install huggingface_hub

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m huggingface_hub repo upload \
            ./ \
            Anurag1/synthetic-reason-collective \
            --repo-type space \
            --token $HF_TOKEN \
            --commit-message "Auto-deploy from GitHub: $GITHUB_SHA"
